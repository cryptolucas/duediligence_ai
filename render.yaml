# Blueprint de Render: Catalejo Deal Desk completo en UN solo servicio gratuito + base de datos gratuita.
# Render → New → Blueprint → seleccione este repositorio. Solo le pedirá GROQ_API_KEY y ACCESS_CODE.
# El enlace público para los usuarios es la URL del servicio (https://catalejo-xxxx.onrender.com).
databases:
  - name: catalejo-db
    plan: free            # vence a los 30 días (+14 de gracia): suficiente para una fase de pruebas
    databaseName: catalejo
    user: catalejo

services:
  - type: web
    name: catalejo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Base de datos creada arriba (si prefiere Neon, reemplace este valor por su cadena postgresql://...)
      - key: DATABASE_URL
        fromDatabase:
          name: catalejo-db
          property: connectionString
      # Clave gratuita de https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      # Código que escribirán los usuarios de prueba (vacío = acceso libre)
      - key: ACCESS_CODE
        sync: false
      - key: MAX_CONCURRENT_JOBS
        value: "2"
