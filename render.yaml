# Blueprint de Render: backend FastAPI en el plan gratuito.
# Render → New → Blueprint → seleccione este repositorio. Las variables con "sync: false" se piden al crear.
services:
  - type: web
    name: catalejo-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Clave gratuita de https://console.groq.com/keys
      - key: GROQ_API_KEY
        sync: false
      # Cadena de conexión de Neon (postgresql://...); sin ella los datos se pierden al reiniciar
      - key: DATABASE_URL
        sync: false
      # URL pública del frontend en Vercel, ej. https://catalejo.vercel.app
      - key: CORS_ORIGINS
        sync: false
      # Código que escribirán los usuarios de prueba (déjelo vacío para acceso libre)
      - key: ACCESS_CODE
        sync: false
      - key: STORAGE_DIR
        value: /tmp/catalejo-storage
      - key: MAX_CONCURRENT_JOBS
        value: "2"
